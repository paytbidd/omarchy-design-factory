<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Omarchy plugins — Payton Biddington</title>
    <meta
      name="description"
      content="Payton’s Omarchy tweaks. Small plugins, one-line installs, listed from public paytbidd/omarchy-* repos."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./icons/default.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("plugin-scheme");
          var scheme =
            stored ||
            (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.scheme = scheme;
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip" href="#plugins">Skip to plugins</a>
    <div class="page">
      <header class="mast">
        <a class="who" href="https://github.com/paytbidd">
          <img
            class="avatar"
            src="./avatar.png"
            width="48"
            height="48"
            alt="Payton Biddington"
          />
          <span class="who-copy">
            <strong>Payton Biddington</strong>
            <span class="handle">github.com/paytbidd</span>
          </span>
        </a>
        <p class="blurb">Omarchy tweaks. Small plugins, one-line&nbsp;installs.</p>
      </header>

      <main>
        <h1 class="visually-hidden">Omarchy plugins</h1>
        <section id="plugins" aria-label="Plugins">
          <div class="list" data-plugin-grid>
            <p class="empty">Loading…</p>
          </div>
        </section>
      </main>

      <footer class="foot">
        <p>
          <a href="https://paytonb.com">paytonb.com</a>
          ·
          <a href="https://omarchy.org">omarchy.org</a>
        </p>
        <button class="moon" type="button" data-scheme-toggle aria-label="Switch to night">
          <svg class="moon-fill" viewBox="0 0 16 16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M13.6 10.35A6.2 6.2 0 0 1 5.65 2.5 6.5 6.5 0 1 0 13.6 10.35z"
            />
          </svg>
          <svg
            class="moon-outline"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.25"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M13.6 10.35A6.2 6.2 0 0 1 5.65 2.5 6.5 6.5 0 1 0 13.6 10.35z" />
          </svg>
        </button>
      </footer>
    </div>
    <script src="./app.js" type="module"></script>
  </body>
</html>
